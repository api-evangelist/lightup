generated: '2026-07-19'
method: searched
status: published
source: https://github.com/lightup-data/lightup
server:
  name: lightup
  product_name: Lightup Agentic
  transport: sse
  url: null
  url_note: The MCP server URL is provisioned per customer and supplied by the Lightup
    team; it is not a single public endpoint. Clients connect as /sse?host=<your Lightup
    instance URL>&refresh_token=<your JWT refresh token>.
  stateless: true
  credentials: Each connection carries its own credentials in the URL; nothing is stored
    server-side and sessions are fully isolated.
  backend: Calls through to the Lightup REST API on the customer's own instance.
install:
  setup_script: 'curl -sL https://raw.githubusercontent.com/lightup-data/lightup/main/setup.sh
    | bash -s -- claude'
  clients:
  - name: Claude Code
    status: available
    method: setup.sh, or Claude Code plugin
    plugin_marketplace: claude plugin marketplace add lightup-data/lightup
    plugin_install: claude plugin install lightup-ai@lightup
  - name: Gemini CLI
    status: available
    method: setup.sh, or Gemini CLI extension
    extension_install: gemini extensions install https://github.com/lightup-data/lightup
  - name: Codex CLI
    status: coming soon
  credential_file: lightup-api-credential*.json downloaded from the Lightup UI (Profile
    -> API Credentials -> Download); setup auto-discovers it in ~/Downloads, ~/Desktop
    or ~.
prerequisites:
- An active Lightup instance with at least Viewer access, or a 30-day free trial at
  https://my.lightup.ai
- Network access from the client machine to the Lightup MCP server URL
