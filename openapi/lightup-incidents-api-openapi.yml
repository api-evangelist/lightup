                    type: string
                    writeOnly: true
                  send_reminder:
                    default: false
                    description: True if sending recurring notification needed
                    title: Send Reminder
                    type: boolean
                  slice:
                    description: Slice associated with incident
                    title: Slice
                    type: object
                  start_ts:
                    description: Start timestamp (epoch) of incident
