                  validation:
                    allOf:
                    - $ref: '#/paths/~1api~1v0~1ws~1%7Bworkspace_id%7D~1incidents~1%7Bincident_uuid%7D/get/responses/200/content/application~1json/schema/definitions/IncidentValidation'
                    description: Status of incident validation.
                    title: Validation
                required:
                - uuid
                - incident_type
                - filter_uuid
                - slice
                - start_ts
                - end_ts
                - ongoing
                title: LegacyIncident
                type: object
          description: ''
      summary: Get the detail of an incident
      tags:
      - Incidents
  /api/v0/ws/{workspace_id}/incidents/{incident_uuid}/comments:
    get:
      description: ''
      parameters:
      - description: UUID of the workspace; visible in the workspace URL.
        explode: true
        in: path
        name: workspace_id
        required: true
        schema:
          description: UUID of the workspace; visible in the workspace URL.
          title: workspace_id
          type: string
      - description: UUID of the incident to get.
        explode: true
        in: path
        name: incident_uuid
        required: true
        schema:
          description: UUID of the incident to get.
          title: incident_uuid
          type: string
      - description: 'Input ''Bearer _access-token_''. To obtain access token, see API, API Credentials: Get access token.'
        explode: true
        in: header
        name: authorization
        required: true
        schema:
          description: 'Input ''Bearer _access-token_''. To obtain access token, see API, API Credentials: Get access token.'
          title: authorization
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                definitions:
                  EmailMetadata:
                    additionalProperties: false
                    properties:
                      detail:
                        description: 'The detail of the message posted to the channel (eg.: subject, title, summary)'
                        title: Detail
                        type: string
                      id:
                        format: uuid
                        title: Id
                        type: string
                      incidentAlertType:
                        allOf:
                        - $ref: '#/paths/~1api~1v0~1ws~1%7Bworkspace_id%7D~1incidents~1%7Bincident_uuid%7D~1comments/get/responses/200/content/application~1json/schema/definitions/IncidentAlertType'
                        default: 1
                      messageId:
                        title: Messageid
                        type: string
                      type:
                        default: email
                        enum:
                        - email
                        title: Type
                        type: string
                    required:
                    - id
                    title: EmailMetadata
                    type: object
                  IncidentAlertType:
                    description: An enumeration.
                    enum:
                    - 1
