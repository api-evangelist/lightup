                    title: Creation Ts
                    type: number
                  direction:
                    allOf:
                    - $ref: '#/paths/~1api~1v0~1ws~1%7Bworkspace_id%7D~1incidents~1%7Bincident_uuid%7D/get/responses/200/content/application~1json/schema/definitions/IncidentDirection'
