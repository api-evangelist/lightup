                      - basicAuth
                      title: Authtype
                      type: string
                    description:
                      title: Description
                      type: string
                    digestPeriodInSeconds:
                      default: 0
                      title: Digestperiodinseconds
                      type: integer
                    domainName:
                      title: Domainname
                      type: string
                    enableRecurring:
                      default: false
                      title: Enablerecurring
                      type: boolean
                    key:
