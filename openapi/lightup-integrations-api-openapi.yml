                      type: string
                    sendHealthyDigest:
                      default: false
                      title: Sendhealthydigest
                      type: boolean
                    server:
                      title: Server
                      type: string
                    timezone:
                      default: UTC
                      title: Timezone
                      type: string
                    type:
                      default: jira
                      enum:
                      - jira
                      title: Type
                      type: string
                    username:
