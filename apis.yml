aid: lightup
name: Lightup
description: 'Lightup Data, Inc. is an enterprise data quality and data observability
  platform that lets data teams detect, diagnose, and resolve data issues across cloud
  and hybrid data stacks. The platform runs pushdown data quality checks (DQIs) directly
  against customer datasources — Snowflake, Databricks, Redshift, BigQuery, Postgres,
  Athena, Oracle, Teradata, SAP HANA, Dremio, Incorta, ksqlDB and S3/Azure blob storage
  — so no customer source data is copied into the Lightup environment. Capabilities
  include zero-config auto metrics, sliced metrics, AI-based anomaly detection, data
  profiling, data reconciliation, data lineage, incident management, and an agentic
  interface (Lightup Agentic) that exposes the platform to MCP-compatible AI agents.
  Lightup exposes a REST API for workspaces, datasources, metrics, monitors, incidents,
  integrations, dashboards and users, a Python CLI (lightctl), an Airflow provider,
  and an official MCP server. Founded by Manu Bansal; backed by a16z; SOC 2 Type 2
  and ISAE 3000 compliant.'
